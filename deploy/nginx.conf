# 管理面板站点配置（参考实现：需放到服务器 nginx 的 conf.d/sites-available 下并 reload 才生效）。
#
# 三个关键点：
#   1. /api/ 必须原样转发给后端容器：proxy_pass 结尾不要带 /，
#      带了会剥掉 /api/ 前缀，后端收到 /v1/... 直接 404。
#   2. 前端是纯静态 SPA，产物只有 _shell.html（没有 index.html），
#      回退目标必须写 /_shell.html，写成 /index.html 会导致所有深链 404。
#   3. 静态资源目录单独加 =404：否则资源文件被删后，旧页面会拿到一份 HTML，
#      排查起来非常费劲。
server {
    listen 80;
    server_name _;

    # 前端静态产物目录，也是 Jenkins 流水线 rsync 的目标目录
    root /var/www/medical-web;
    index _shell.html;

    # 后端 API：保留 /api/ 前缀转发到本机后端容器（容器端口见 deploy/docker-compose.yaml）
    location /api/ {
        proxy_pass http://127.0.0.1:9080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 构建产物文件名带内容哈希，可以长期缓存
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 回退：其余路径一律交给前端路由，服务端不参与路由判断
    location / {
        try_files $uri /_shell.html;
    }
}
